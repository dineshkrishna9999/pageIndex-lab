[project]
name = "vectorless-rag"
version = "0.1.0"
description = "Exploring PageIndex — vectorless RAG with page-level context"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk",
    "litellm>=1.82.0",
    "pymupdf>=1.26.4",
    "PyPDF2>=3.0.1",
    "python-dotenv>=1.1.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "poethepoet>=0.29.0",
    "ruff>=0.9.0",
]

[tool.uv]
dev-dependencies = [
    "poethepoet>=0.29.0",
    "ruff>=0.9.0",
]

[tool.poe.tasks]
demo     = "python demo.py"
lint     = "ruff check ."
format   = "ruff format ."
clean    = { shell = "find . -type d -name __pycache__ | xargs rm -rf" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
