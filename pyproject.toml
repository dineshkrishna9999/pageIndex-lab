[project]
name = "pageindex-lab"
version = "0.1.0"
description = "Try PageIndex locally with an ADK agent"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "google-adk",
    "pageindex>=0.2.19",
    "pydantic-settings>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/dineshkrishna9999/pageIndex-lab"
Repository = "https://github.com/dineshkrishna9999/pageIndex-lab"
Issues = "https://github.com/dineshkrishna9999/pageIndex-lab/issues"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "poethepoet>=0.48.0",
    "ruff>=0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
fix = true
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false

[tool.poe.tasks.agent]
help = "Open the PageIndex agent in ADK web"
cmd = "adk web"
